name: Deploy Docker Image Locally (on runner, no SSH)

# Runs the playbook directly against the GitHub Actions runner itself.
# The runner IS Ubuntu, so this exercises tasks/ubuntu.yml the same way
# scripts/setup-linux.sh + a local run would on a real Ubuntu machine —
# connection=local, no SSH, no remote target involved.
on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: "Docker image to deploy, e.g. nginx:latest"
        required: true
      container_name:
        description: "Name for the running container"
        required: true
        default: "app"
      docker_ports:
        description: 'JSON list of "host:container" port mappings, e.g. ["8080:80"]'
        required: false
        default: "[]"
      docker_env:
        description: "JSON object of environment variables, e.g. {\"FOO\": \"bar\"}"
        required: false
        default: "{}"
      docker_volumes:
        description: 'JSON list of "host:container" volume mounts'
        required: false
        default: "[]"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ansible and required collections
        run: |
          pip install --upgrade ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Generate local inventory for this run
        run: |
          cat > inventory-local-ci.ini <<EOF
          [ubuntu]
          localhost ansible_connection=local
          EOF

      - name: Write extra-vars file
        run: |
          cat > extra-vars.json <<EOF
          {
            "docker_image": "${{ inputs.docker_image }}",
            "container_name": "${{ inputs.container_name }}",
            "docker_ports": ${{ inputs.docker_ports }},
            "docker_env": ${{ inputs.docker_env }},
            "docker_volumes": ${{ inputs.docker_volumes }}
          }
          EOF
          cat extra-vars.json

      - name: Run playbook locally on the runner
        run: ansible-playbook -i inventory-local-ci.ini playbook.yml -l ubuntu -e @extra-vars.json

      - name: Verify container is running
        run: docker ps --filter "name=${{ inputs.container_name }}"

      - name: Check container health over HTTP (if ports were mapped)
        run: |
          HOST_PORT=$(echo '${{ inputs.docker_ports }}' | jq -r '.[0] // empty' | cut -d: -f1)
          if [ -n "$HOST_PORT" ]; then
            echo "Waiting a few seconds for the app to finish starting..."
            sleep 5
            echo "Requesting http://localhost:$HOST_PORT ..."
            curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" "http://localhost:$HOST_PORT" || \
              echo "Request failed outright (connection refused/timeout) - check the app's logs above."
          else
            echo "No ports were mapped for this run; skipping HTTP check."
          fi

      - name: Clean up container (tidy logs; the runner VM is destroyed after this job regardless)
        if: always()
        run: |
          docker stop "${{ inputs.container_name }}" 2>/dev/null || true
          docker rm "${{ inputs.container_name }}" 2>/dev/null || true

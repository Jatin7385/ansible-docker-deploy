---
- name: Check if Docker CLI is available
  command: docker --version
  register: docker_check
  ignore_errors: true
  changed_when: false

- name: Install prerequisite packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  become: true
  when: docker_check.rc != 0

- name: Add Docker's official GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: true
  when: docker_check.rc != 0

- name: Add Docker apt repository
  apt_repository:
    repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  become: true
  when: docker_check.rc != 0

- name: Install Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true
  become: true
  when: docker_check.rc != 0

- name: Ensure Docker service is started and enabled
  systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Ensure current user can run docker without sudo
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  become: true

- name: Reset connection so new docker group membership takes effect
  meta: reset_connection

- name: Install Python Docker SDK
  apt:
    name: python3-docker
    state: present
  become: true

# Inventory for deploying to a REMOTE server over SSH, instead of locally.
#
# Nothing else in this project changes for this to work: playbook.yml and
# tasks/ubuntu.yml were already written to be connection-agnostic (they use
# `become: true` + standard modules, not `connection: local`), so SSH just
# works once you point Ansible at real host details below.
#
# Fill in your actual server details, then run with:
#
#   ansible-playbook -i inventory-ssh.ini playbook.yml -l ubuntu \
#     -e docker_image=nginx:latest \
#     -e container_name=nginx \
#     -e '{"docker_ports": ["8080:80"]}'
#
# (-i here overrides the default inventory.ini from ansible.cfg, so this
# never touches/conflicts with the local-only setup in inventory.ini.)

[ubuntu]
myserver ansible_host=203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Add more remote hosts the same way, one per line:
# otherserver ansible_host=203.0.113.20 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Notes:
# - ansible_host      -> the server's IP or DNS name
# - ansible_user      -> the SSH login user (must have sudo rights, since
#                        tasks/ubuntu.yml uses become: true for package
#                        installs and the systemd service)
# - ansible_ssh_private_key_file -> path to the private key matching a
#                        public key already authorized on that server
#                        (i.e. already in that user's ~/.ssh/authorized_keys)
#
# First connection to a brand-new host will prompt to accept its SSH host
# key unless host_key_checking is disabled in ansible.cfg (it already is,
# via the existing ansible.cfg in this project).

# --- macOS: run locally, no SSH ---
[macos]
localhost ansible_connection=local

# --- Ubuntu: run locally (uncomment if this control machine IS the Ubuntu box) ---
[ubuntu]
# localhost ansible_connection=local
#
# Or target a separate Ubuntu machine over SSH:
# myubuntu ansible_host=<ip> ansible_user=<user> ansible_ssh_private_key_file=~/.ssh/id_rsa

# --- Windows: MUST be reached via WinRM from a Mac/Linux/WSL control node ---
# (Ansible cannot run natively as a control node on Windows without WSL)
[windows]
# mywindows ansible_host=<ip> ansible_user=Administrator ansible_password=<password>
#   ansible_connection=winrm
#   ansible_winrm_transport=basic
#   ansible_port=5986
#   ansible_winrm_server_cert_validation=ignore
